name: Fix narrow-mobile reference grid
on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-reference-320.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct 320px breakpoint scope in reference CSS
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('reference-home-shell-2026.css');s=p.read_text()
          rule="#panel-home.ref-home .elara-dashboard-grid.ref-home-grid{grid-template-columns:minmax(0,1fr)!important;grid-template-areas:'tasks' 'habits' 'wellness' 'missions' 'ranks' 'activity' 'goals'!important}"
          assert rule in s, 'expected existing single-column breakpoint not found'
          s += '\n/* Narrow mobile: explicit single-column slots outside reduced-motion scope. */\n@media(max-width:359px){'+rule+'#panel-home.ref-home .elara-dashboard-grid.ref-home-grid>.ref-tasks{grid-column:1!important;grid-row:1!important}#panel-home.ref-home .elara-dashboard-grid.ref-home-grid>.ref-habits{grid-column:1!important;grid-row:2!important}#panel-home.ref-home .elara-dashboard-grid.ref-home-grid>.ref-wellness-card{grid-column:1!important;grid-row:3!important}#panel-home.ref-home .elara-dashboard-grid.ref-home-grid>.ref-missions{grid-column:1!important;grid-row:4!important}#panel-home.ref-home .ref-right-stack>.ref-ranks{grid-column:1!important;grid-row:5!important}#panel-home.ref-home .ref-right-stack>.ref-activity{grid-column:1!important;grid-row:6!important}#panel-home.ref-home .elara-dashboard-grid.ref-home-grid>.ref-goals{grid-column:1!important;grid-row:7!important}}\n'
          # Desktop reference y=84: 80px header + 4px interior gap, rather than 12px.
          s=s.replace('padding:12px 20px 30px!important','padding:4px 20px 30px!important',1)
          p.write_text(s)
          PY
      - name: Commit corrected narrow breakpoint
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reference-home-shell-2026.css
          git commit -m 'fix: single-column Home at 320px and align desktop hero'
          git pull --rebase origin main
          git push origin HEAD:main
