name: Reference restoration acceptance
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start test server
        run: python3 -m http.server 4173 >/tmp/elara-http.log 2>&1 &
      - name: End HEAD browser acceptance and screenshots
        run: |
          node tests/restore-browser.mjs
          node tests/product-pass-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elara-reference-${{ github.sha }}
          path: browser-artifacts/
          if-no-files-found: error
          retention-days: 30
