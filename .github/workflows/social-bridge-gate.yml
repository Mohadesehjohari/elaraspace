name: Social Bridge Firebase Emulator gate

on:
  push:
    branches:
      - social-closure/bridge-rules-20261008
  pull_request:
    branches:
      - social-closure/20261008
  workflow_dispatch:

permissions:
  contents: read

jobs:
  old-client-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator test dependencies
        run: npm install --prefix tests --no-package-lock
      - name: Old production 57914b client Firestore contract with Bridge Rules
        run: |
          npx --yes firebase-tools@latest emulators:exec --only firestore,storage --project demo-elara-rules --config firebase.json "node tests/social-bridge-old-client-emulator.mjs"

  new-client-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator test dependencies
        run: npm install --prefix tests --no-package-lock
      - name: Social Closure candidate and Bridge Firestore + Storage rules
        run: |
          npx --yes firebase-tools@latest emulators:exec --only firestore,storage --project demo-elara-rules --config firebase.json "node tests/social-bridge-new-client-emulator.mjs && node tests/storage-rules-emulator.mjs"

  security-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator test dependencies
        run: npm install --prefix tests --no-package-lock
      - name: Challenge bridge adversarial tests (must reject legacy-shaped rate bypass)
        run: |
          npx --yes firebase-tools@latest emulators:exec --only firestore,storage --project demo-elara-rules --config firebase.json "node tests/social-bridge-security-emulator.mjs"
