name: Friends dashboard baseline and live contract
on:
  pull_request:
    paths:
      - 'tests/product-hubs-store-browser.mjs'
      - 'tests/friends-hub-browser.mjs'
      - 'tests/social-layout-browser.mjs'
      - 'tests/challenges-stage12-browser.mjs'
      - 'social-view.js'
      - 'friends-hub.css'
      - 'social-challenges-ui.js'
      - '.github/workflows/friends-compact-contract.yml'
  push:
    branches: [main]
    paths:
      - 'tests/product-hubs-store-browser.mjs'
      - '.github/workflows/friends-compact-contract.yml'
permissions:
  contents: read
jobs:
  baseline-reproduction:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install real Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve untouched main baseline at 4174
        run: |
          python3 -m http.server 4174 --directory baseline >/tmp/friends-baseline.log 2>&1 &
          sleep 3
          curl -fLsS http://127.0.0.1:4174/boot.js > /dev/null
      - name: Verify nine-width Friends F2 dashboard against latest main
        shell: bash
        run: |
          set -euo pipefail
          ELARA_TEST_URL=http://127.0.0.1:4174 node baseline/tests/friends-hub-browser.mjs 2>&1 | tee baseline-friends-contract.log
          grep -F "FRIENDS_F2_PASS" baseline-friends-contract.log
          echo "BASELINE_COMPACT_NAV_PASS main=$(git -C baseline rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: main-released-friends-compact-contract
          path: baseline-friends-contract.log
          if-no-files-found: warn
          retention-days: 14

  candidate-contract:
    if: github.event_name == 'pull_request'
    needs: baseline-reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact ownership and syntax
        shell: bash
        run: |
          git fetch origin main
          git diff --name-only origin/main...HEAD | tee /tmp/changed-files.txt
          if grep -Ev '^(social-view\.js|social-clubs-ui\.js|friends-hub\.css|social-challenges-ui\.js|tests/friends-hub-browser\.mjs|tests/product-hubs-store-browser\.mjs|tests/social-layout-browser\.mjs|tests/challenges-stage12-browser\.mjs|\.github/workflows/friends-compact-contract\.yml)$' /tmp/changed-files.txt; then
            echo "::error::Changes outside scoped Friends F2 and its regression tests"; exit 1
          fi
          node --check tests/product-hubs-store-browser.mjs
          node --check social-view.js
          node --check social-clubs-ui.js
          node --check social-challenges-ui.js
          node --check tests/social-layout-browser.mjs
          node --check tests/friends-hub-browser.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve candidate
        run: |
          python3 -m http.server 4173 >/tmp/friends-contract-candidate.log 2>&1 &
          sleep 3
          curl -fLsS http://127.0.0.1:4173/friends-hub.css >/dev/null
      - name: Product hubs, compact tabs, actual clicks, Ranking and main dock
        run: timeout 400s node tests/product-hubs-store-browser.mjs
      - name: Dedicated Friends nine-width dashboard browser
        run: timeout 500s node tests/friends-hub-browser.mjs
      - name: Social layout, requests tab, ranking and overflow
        run: timeout 180s node tests/social-layout-browser.mjs
      - name: Existing challenge navigation contract
        run: timeout 180s node tests/challenges-stage12-browser.mjs
      - name: Home, username and collaboration invariants
        run: |
          node tests/p0-home-contract.test.mjs
          node tests/username-integrity-audit.test.mjs
          node tests/collab-invite-regression.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-friends-navigation
          path: browser-artifacts/friends-hub-*.png
          if-no-files-found: warn
          retention-days: 20

  live-contract:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for exact GitHub Pages bytes of merged code
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 90); do
            ok=true
            for file in index.html social-view.js friends-hub.css social-challenges-ui.js tests/product-hubs-store-browser.mjs tests/friends-hub-browser.mjs tests/social-layout-browser.mjs; do
              output="/tmp/friends-pages-$(basename "$file")"
              if ! curl -fLsS --max-time 20 "https://mohadesehjohari.github.io/elaraspace/$file?release=$GITHUB_SHA&attempt=$attempt" -o "$output" || ! cmp -s "$file" "$output"; then ok=false;break;fi
            done
            if [ "$ok" = true ]; then echo "FRIENDS_LIVE_EXACT_BYTES_PASS sha=$GITHUB_SHA";break;fi
            sleep 8
          done
          if [ "$ok" != true ]; then echo "::error::Pages bytes did not match main";exit 1;fi
      - name: Verify actual public Pages in Chromium with isolated fixture accounts
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          ELARA_TEST_URL=https://mohadesehjohari.github.io/elaraspace timeout 420s node tests/product-hubs-store-browser.mjs
          ELARA_TEST_URL=https://mohadesehjohari.github.io/elaraspace timeout 540s node tests/friends-hub-browser.mjs
          ELARA_TEST_URL=https://mohadesehjohari.github.io/elaraspace timeout 180s node tests/social-layout-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-friends-compact-${{ github.sha }}
          path: browser-artifacts/friends-hub-*.png
          retention-days: 30
          if-no-files-found: warn
