name: Wardrobe P3 Reference Browser Gate
on:
  pull_request:
    paths:
      - approved-visual.js
      - wardrobe-reference.css
      - tests/wardrobe-reference-browser.mjs
      - .github/workflows/wardrobe-reference-gate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wardrobe:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, canonical username safety and isolated diff
        shell: bash
        run: |
          set -e
          node --check approved-visual.js
          node --check tests/wardrobe-reference-browser.mjs
          node tests/username-runtime-regression.test.mjs
          if git diff --name-only origin/main...HEAD | grep -E '^(friends-hub.css|elara-social.js|firestore.rules|storage.rules|cloud.js|mobile-ia-2026-10-05.*|ROADMAP.md)$'; then
            echo "::error::Concurrent-owned file edited"; exit 1
          fi
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run nine responsive Wardrobe interaction tests
        shell: bash
        run: |
          python3 -m http.server 4173 >/tmp/wardrobe.log 2>&1 &
          sleep 3
          timeout 360s node tests/wardrobe-reference-browser.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wardrobe-p3-${{ github.sha }}
          path: artifacts/wardrobe-p3/
          retention-days: 21
          if-no-files-found: warn
