name: Production Home Owner Asset Verification
on:
  push:
    branches: [qa/live-home-owner-postmerge-20261008]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify QA branch descends from deployed merge SHA
        run: |
          git merge-base --is-ancestor dd590d08ffef6c24b02889b5f7481dcdc808f19b HEAD
          git rev-parse dd590d08ffef6c24b02889b5f7481dcdc808f19b
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Exact live file bytes and live Home Chromium 320 375 390 430 768 1440
        run: timeout 600s node tests/live-home-owner-production-verification.mjs
      - name: Retest pre-merge Home data fixture on actual production site
        env:
          ELARA_TEST_URL: https://mohadesehjohari.github.io/elaraspace
        run: timeout 400s node tests/home-owner-assets-browser.mjs
      - name: Live Social Core startup
        env:
          ELARA_TEST_URL: https://mohadesehjohari.github.io/elaraspace
        run: timeout 180s node tests/social-live-core-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-home-owner-merge-dd590d08
          path: browser-artifacts/*png
          if-no-files-found: warn
          retention-days: 14
