name: Secondary Route Bootstrap Diagnosis
on:
  pull_request:
    paths:
      - tests/secondary-route-boot-diagnostic.mjs
      - .github/workflows/secondary-route-boot-diagnostic.yml
      - boot.js
      - index.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve
        run: |
          python3 -m http.server 4173 >/tmp/secondary-http.log 2>&1 &
          sleep 2
      - name: Profile all route owners
        run: timeout 165s node tests/secondary-route-boot-diagnostic.mjs
