name: FOCUS-02 Library Inline and Immersive Fidelity
on:
  pull_request:
    paths:
      - index.html
      - lib01-library-dashboard.js
      - focus-two-stage.js
      - focus-two-stage.css
      - tests/focus-two-stage-browser.mjs
      - .github/workflows/focus-two-stage.yml
  push:
    branches: [main]
    paths:
      - index.html
      - lib01-library-dashboard.js
      - focus-two-stage.js
      - focus-two-stage.css
      - tests/focus-two-stage-browser.mjs
      - .github/workflows/focus-two-stage.yml
permissions:
  contents: read
jobs:
  candidate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JS syntax and approved asset
        run: |
          node --check focus-two-stage.js
          node --check lib01-library-dashboard.js
          node --check tests/focus-two-stage-browser.mjs
          test -s assets/ui/bg_focus_room.webp
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0 jsdom@30.1.1
          npx playwright install --with-deps chromium
      - name: Focus 02 real DOM routes and responsive viewports
        run: |
          python3 -m http.server 4173 >/tmp/focus02-http.log 2>&1 &
          sleep 3
          timeout 420s node tests/focus-two-stage-browser.mjs
          timeout 420s node tests/focus-background-fidelity-browser.mjs
          timeout 420s node tests/library-dashboard-lib01-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focus02-candidate
          path: browser-artifacts/**/*.png
          retention-days: 20
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact GitHub Pages published files
        run: |
          set -euo pipefail
          ok=false
          for attempt in $(seq 1 80); do
            ok=true
            for file in index.html focus-two-stage.js focus-two-stage.css lib01-library-dashboard.js; do
              output="/tmp/focus02-$(basename "$file")"
              if ! curl -fLsS --max-time 20 "https://mohadesehjohari.github.io/elaraspace/$file?sha=$GITHUB_SHA&attempt=$attempt" -o "$output" || ! cmp -s "$file" "$output"; then ok=false;break;fi
            done
            if [ "$ok" = true ]; then echo "FOCUS02_LIVE_EXACT_BYTES_PASS sha=$GITHUB_SHA";break;fi
            sleep 8
          done
          if [ "$ok" != true ]; then echo "::error::Production bytes mismatch";exit 1;fi
      - name: Browser test against published production
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          ELARA_TEST_URL=https://mohadesehjohari.github.io/elaraspace timeout 420s node tests/focus-two-stage-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focus02-live
          path: browser-artifacts/focus02/*.png
          retention-days: 30
