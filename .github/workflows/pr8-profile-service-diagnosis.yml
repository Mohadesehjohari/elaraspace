name: PR8 profile service diagnosis

on:
  pull_request:
    paths:
      - '.github/workflows/pr8-profile-service-diagnosis.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_SHA: aab22fff0e43afba9503f68f93d70795e1186d6a
      PREVIEW_URL: http://127.0.0.1:4173/index.html
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve exact target SHA
        run: |
          mkdir -p /tmp/elara-exact
          git archive "$TARGET_SHA" | tar -x -C /tmp/elara-exact
          (cd /tmp/elara-exact && python3 -m http.server 4173 >/tmp/elara-profile-diag-http.log 2>&1 &)
          sleep 2
          cmp -s /tmp/elara-exact/boot.js <(git show "$TARGET_SHA:boot.js")
          cmp -s /tmp/elara-exact/approved-profile-system.js <(git show "$TARGET_SHA:approved-profile-system.js")
          cmp -s /tmp/elara-exact/elara-social.js <(git show "$TARGET_SHA:elara-social.js")
      - name: Diagnose exact preview with real modules
        run: |
          cat > verify-profile-service.mjs <<'NODE'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';

          const url=process.env.PREVIEW_URL;
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844}});
          const page=await context.newPage();
          const started=Date.now(),consoleRows=[],pageErrors=[],failedRequests=[],socialResponses=[];
          page.on('console',m=>consoleRows.push({t:Date.now()-started,type:m.type(),text:m.text()}));
          page.on('pageerror',e=>pageErrors.push({t:Date.now()-started,message:e.message,stack:e.stack||''}));
          page.on('requestfailed',r=>{if(r.url().includes('elara-social.js'))failedRequests.push({t:Date.now()-started,url:r.url(),failure:r.failure()})});
          page.on('response',r=>{if(r.url().includes('elara-social.js'))socialResponses.push({t:Date.now()-started,url:r.url(),status:r.status(),type:r.headers()['content-type']||'',location:r.headers()['location']||''})});
          await page.addInitScript(()=>{
            window.__diag={events:[],unhandled:[]};
            const stamp=(name,detail={})=>window.__diag.events.push({name,t:performance.now(),detail});
            for(const name of ['elara:account-ready','elara:account-gate-ready','elara:cloud-unavailable','elara:social-updated']){
              addEventListener(name,e=>stamp(name,{uid:window.ElaraAccount?.user?.uid||null,saveType:typeof window.ElaraSocial?.saveProfileValues,detail:e?.detail||null}));
            }
            addEventListener('unhandledrejection',e=>window.__diag.unhandled.push({t:performance.now(),reason:String(e.reason?.stack||e.reason||'')}));
            let last='';
            setInterval(()=>{
              const v=typeof window.ElaraSocial?.saveProfileValues;
              if(v!==last){last=v;stamp('social-save-type',{value:v,uid:window.ElaraAccount?.user?.uid||null})}
            },25);
          });

          const response=await page.goto(url+'?diag='+Date.now(),{waitUntil:'domcontentloaded',timeout:60000});
          await page.waitForFunction(()=>window.ElaraProfileSystem&&window.ElaraDialog,{timeout:30000});
          const editorOpenedAt=Date.now()-started;
          const before=await page.evaluate(()=>({
            href:location.href,
            title:document.title,
            accountExists:!!window.ElaraAccount,
            uid:window.ElaraAccount?.user?.uid||null,
            socialExists:!!window.ElaraSocial,
            saveType:typeof window.ElaraSocial?.saveProfileValues,
            optionalFailures:window.__elaraOptionalFailures||[],
            bodyClass:document.body.className,
            cloudReady:document.body.classList.contains('cloud-ready'),
            cloudOffline:document.body.classList.contains('cloud-offline'),
            booting:document.documentElement.hasAttribute('data-elara-booting')
          }));
          await page.evaluate(()=>window.ElaraProfileSystem.openEditor());
          await page.waitForSelector('#elara-central-profile-form',{timeout:10000});
          const editorState=await page.evaluate(()=>({
            saveType:typeof window.ElaraSocial?.saveProfileValues,
            status:document.querySelector('[data-profile-edit-status]')?.textContent||'',
            saveDisabled:!!document.querySelector('#elara-central-profile-form [type=submit]')?.disabled
          }));

          let becameReady=true;
          try{await page.waitForFunction(()=>typeof window.ElaraSocial?.saveProfileValues==='function',{timeout:20000})}catch{becameReady=false}
          const after=await page.evaluate(()=>({
            accountExists:!!window.ElaraAccount,
            uid:window.ElaraAccount?.user?.uid||null,
            socialExists:!!window.ElaraSocial,
            saveType:typeof window.ElaraSocial?.saveProfileValues,
            optionalFailures:window.__elaraOptionalFailures||[],
            bodyClass:document.body.className,
            events:window.__diag?.events||[],
            unhandled:window.__diag?.unhandled||[]
          }));

          const accountEvent=after.events.find(e=>e.name==='elara:account-ready'||e.name==='elara:account-gate-ready');
          const socialEvent=after.events.find(e=>e.name==='social-save-type'&&e.detail?.value==='function');
          const timing=accountEvent&&socialEvent?{accountEvent:accountEvent.name,accountMs:accountEvent.t,socialReadyMs:socialEvent.t,deltaMs:socialEvent.t-accountEvent.t}:null;
          const result={targetSha:process.env.TARGET_SHA,navigationStatus:response?.status()||null,editorOpenedAt,before,editorState,becameReady,after,timing,socialResponses,failedRequests,pageErrors,consoleErrors:consoleRows.filter(x=>x.type==='error')};
          console.log('PROFILE_SERVICE_DIAG '+JSON.stringify(result,null,2));

          assert.equal(becameReady,true,'ElaraSocial.saveProfileValues never became available');
          assert.ok(socialResponses.some(x=>x.status===200),'elara-social.js did not return HTTP 200');
          assert.ok(socialResponses.every(x=>/javascript|ecmascript/i.test(x.type)),'elara-social.js MIME was not JavaScript: '+JSON.stringify(socialResponses));
          assert.equal(failedRequests.length,0,'elara-social.js request failed');
          assert.equal(pageErrors.length,0,'pageerror during social initialization');
          await browser.close();
          NODE
          node verify-profile-service.mjs
