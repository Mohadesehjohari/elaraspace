name: Verify Live Social Core Pages

on:
  push:
    branches: [main]
    paths:
      - 'elara-social.js'
      - 'social-clubs-ui.js'
      - 'social-groups-ui.js'
      - 'social-challenges-ui.js'
      - 'elara-page.js'
      - 'page-view.js'
      - 'elara-club-media.js'
      - '.github/workflows/verify-social-guard-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Wait for GitHub Pages exact Social Core asset bytes
        shell: bash
        run: |
          set -euo pipefail
          echo "MAIN_SHA=$(git rev-parse HEAD)"
          base="https://mohadesehjohari.github.io/elaraspace"
          live=false
          for attempt in $(seq 1 100); do
            all=true
            for file in elara-social.js social-groups-ui.js social-clubs-ui.js social-challenges-ui.js elara-page.js page-view.js elara-club-media.js; do
              if ! curl --fail --silent --show-error --location --max-time 15 "${base}/${file}?release_sha=${GITHUB_SHA}&attempt=${attempt}" --output "/tmp/elara-live-${file}" || ! cmp -s "${file}" "/tmp/elara-live-${file}"; then
                all=false
                break
              fi
            done
            if [ "$all" = true ]; then
              live=true
              break
            fi
            sleep 8
          done
          test "$live" = true || { echo "::error::Pages failed exact SHA verification"; exit 1; }
          ! grep -Fq 'preventCutoverMutation()' /tmp/elara-live-elara-social.js
          ! grep -Fq 'socialCutover=Object.freeze' /tmp/elara-live-elara-social.js
          ! grep -Fq 'getStorage(' /tmp/elara-live-elara-page.js
          ! grep -Fq "data-club-media=" /tmp/elara-live-social-clubs-ui.js
          echo "LIVE_SOCIAL_SHA_VERIFIED=${GITHUB_SHA}"
          echo "LIVE_SOCIAL_CORE_GUARD_REMOVED_PASS"
          echo "LIVE_SOCIAL_MEDIA_DEFERRED_PASS"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Live site Home/Social/Page smoke, 390px
        env:
          ELARA_TEST_URL: https://mohadesehjohari.github.io/elaraspace
        run: timeout 120s node tests/social-live-core-browser.mjs
