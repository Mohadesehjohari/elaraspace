# Lightweight checks only; heavy browser/emulator QA remains manual.
name: P0 fast regression

on:
  pull_request:
    paths:
      - '.github/workflows/p0-fast-checks.yml'
      - 'index.html'
      - 'app.js'
      - 'phase2.js'
      - 'reference-home-shell-2026.js'
      - 'cloud.js'
      - 'elara-social.js'
      - 'elara-collab.js'
      - 'notifications.js'
      - 'social-view.js'
      - 'language-custom-classes.js'
      - 'collab-2026.css'
      - 'firestore.rules'
      - 'tests/home-first-startup.test.mjs'
      - 'tests/collab-invite-regression.test.mjs'
      - 'tests/social-test.cjs'
      - 'tests/realtime-social-collab-contract.test.mjs'
      - 'tests/static-check.mjs'
      - 'tests/username-runtime-regression.test.mjs'
      - 'tests/username-integrity-audit.test.mjs'
      - 'tools/username-integrity-core.mjs'
      - 'tools/username-integrity-audit.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check app.js
          node --check phase2.js
          node --check reference-home-shell-2026.js
          node --input-type=module --check < cloud.js
          node --input-type=module --check < elara-social.js
          node --input-type=module --check < elara-collab.js
          node --check notifications.js
          node --check social-view.js
          node --check language-custom-classes.js
          node --check tests/realtime-social-collab-contract.test.mjs
          node --check tests/username-runtime-regression.test.mjs
          node --check tests/username-integrity-audit.test.mjs
          node --check tools/username-integrity-core.mjs
          node --check tools/username-integrity-audit.mjs
      - name: Startup and collaboration contracts
        run: |
          node tests/home-first-startup.test.mjs
          node tests/collab-invite-regression.test.mjs
          node tests/realtime-social-collab-contract.test.mjs
          node tests/static-check.mjs
          node tests/username-runtime-regression.test.mjs
          node tests/username-integrity-audit.test.mjs
      - name: Social lifecycle regression
        run: |
          npm install --prefix tests --no-package-lock
          node tests/social-test.cjs
