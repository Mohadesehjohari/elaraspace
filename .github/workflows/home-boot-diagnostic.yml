name: Root cause Home bootstrap diagnostic
on:
  pull_request:
    paths:
      - tests/home-boot-diagnostic.mjs
      - .github/workflows/home-boot-diagnostic.yml
      - boot.js
      - elara-design.js
      - index.html
  workflow_dispatch:
permissions:
  contents: read
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 >/tmp/elara-home-diagnostic.log 2>&1 &
          sleep 2
      - env:
          ELARA_TEST_URL: http://127.0.0.1:4173
        run: timeout 150s node tests/home-boot-diagnostic.mjs
