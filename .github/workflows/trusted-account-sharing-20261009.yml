name: Trusted Accounts Explicit Sharing (Draft)
on:
  push:
    branches:
      - feature/trusted-account-sharing-20261009
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trusted-and-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: JS syntax and share-contract tests
        run: |
          node --check elara-collab.js
          node --check boot.js
          node --check tests/trusted-account-client.test.mjs
          node tests/trusted-account-client.test.mjs
          node tests/collab-invite-regression.test.mjs
          node tests/p0-home-contract.test.mjs
          node tests/username-integrity-audit.test.mjs
      - name: Install emulator rules-test dependencies
        run: npm install --prefix tests --no-package-lock
      - name: Multi-user Firestore and Storage authorization matrix
        run: npx --yes firebase-tools@latest emulators:exec --only firestore,storage --project demo-elara-rules --config firebase.json "node tests/firestore-rules-emulator.mjs"
