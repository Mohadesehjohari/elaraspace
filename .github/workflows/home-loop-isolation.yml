name: Isolate Home JavaScript freeze
on:
  pull_request:
    paths:
      - tests/home-loop-isolation.mjs
      - .github/workflows/home-loop-isolation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 4173 >/tmp/elara-home-isolate.log 2>&1 &
          sleep 2
      - env:
          ELARA_TEST_URL: http://127.0.0.1:4173
        run: timeout 125s node tests/home-loop-isolation.mjs
