name: Astra exact package install
on:
  push:
    branches: [astra-transfer-20260929]
    paths:
      - '.astra-transfer/READY'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          ref: astra-transfer-20260929
          fetch-depth: 0
      - name: Rebuild exact Astra final archive
        shell: bash
        run: |
          set -euo pipefail
          cat .astra-transfer/a9p-* > /tmp/astra9.b64
          echo "7dce969d984f5a0618437e98df745ac3469ce9349c39d677c0761b3ae8fca226  /tmp/astra9.b64" | sha256sum -c -
          base64 -d /tmp/astra9.b64 > /tmp/astra9.tar.xz
          echo "7ef0e96340bcaa5fbf12a34f055d31d2201c63581a791092961bbec8aa0a5e41  /tmp/astra9.tar.xz" | sha256sum -c -
          tar -tJf /tmp/astra9.tar.xz
      - name: Apply final exact Astra files to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          tar -xJf /tmp/astra9.tar.xz -C .
          git config user.name "Elara Astra Installer"
          git config user.email "actions@users.noreply.github.com"
          git add app.js approved-visual.js approved-wellness.js elara-design.js elara-social.js home-functional-pass-2026.css phase2.js reference-home-shell-2026.js visual-fidelity-pass5.css
          if git diff --cached --quiet; then
            echo "No content changes needed."
            exit 0
          fi
          git commit -m "feat: complete exact Astra package install"
          git push origin HEAD:main
