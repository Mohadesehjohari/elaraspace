name: Astra exact package install
on:
  push:
    branches: [astra-transfer-20260929]
    paths:
      - '.astra-transfer/READY'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer branch
        uses: actions/checkout@v4
        with:
          ref: astra-transfer-20260929
          fetch-depth: 0
      - name: Rebuild exact Astra archive
        shell: bash
        run: |
          set -euo pipefail
          cat .astra-transfer/part-* > /tmp/astra.b64
          base64 -d /tmp/astra.b64 > /tmp/astra.tar.xz
          echo "fc69e950784ca4a43969548a930ce5d1ba5f048310190576aed341882f17384d  /tmp/astra.tar.xz" | sha256sum -c -
          tar -tJf /tmp/astra.tar.xz
      - name: Apply package to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          tar -xJf /tmp/astra.tar.xz -C .
          git config user.name "Elara Astra Installer"
          git config user.email "actions@users.noreply.github.com"
          git add CHANGELOG-ASTRA.md MISSING-ASSETS.md REMAINING-ROADMAP.md TEST-NOTES.md VISUAL-MAPPING.md app.js approved-visual.js approved-wellness.js assets/ui/button-view-all.webp boot.js calendar.js elara-design.js elara-finishing.css elara-social.js home-functional-pass-2026.css home-functional-pass-2026.js index.html phase2.js reference-home-shell-2026.js reports.js schedule.js tests/README.md tests/astra-schedule.test.cjs tests/dom-check.cjs tests/integration.cjs tests/package.json tests/social-test.cjs tests/split-test.cjs visual-fidelity-pass5.css
          if git diff --cached --quiet; then
            echo "No content changes needed."
            exit 0
          fi
          git commit -m "feat: install exact Astra visual redesign package"
          git push origin HEAD:main
