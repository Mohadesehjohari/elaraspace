name: Elara browser fixture patch once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/elara-test-fixture-fix-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch acceptance test only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/artwork-home-browser-acceptance.mjs');s=p.read_text()
          def one(a,b):
              global s
              n=s.count(a)
              if n!=1: raise SystemExit(f'expected 1 occurrence, got {n} of {a[:85]}')
              s=s.replace(a,b,1)
          one('function fixture(){const d=new Date()',"function fixture(){if(localStorage.getItem('elara-test-seeded'))return;const d=new Date()")
          one("localStorage.setItem('elara_visual_wardrobe_guest',JSON.stringify({frame:'bronze'}));}","localStorage.setItem('elara_visual_wardrobe_guest',JSON.stringify({frame:'bronze'}));localStorage.setItem('elara-test-seeded','1');}")
          one(' await page.waitForTimeout(450);\n}'," await page.waitForTimeout(450);\n if(seed){await page.evaluate(()=>localStorage.removeItem('elara-test-seeded'));await page.evaluate(fixture);await page.evaluate(()=>window.dispatchEvent(new CustomEvent('elara:hydrate',{detail:JSON.parse(localStorage.getItem('elara_space_v1'))})));await page.evaluate(()=>window.ElaraReferenceHome.render());await page.waitForTimeout(200);}\n}")
          p.write_text(s)
          Path('.github/workflows/elara-test-fixture-fix-once.yml').unlink()
          PY
          node --check tests/artwork-home-browser-acceptance.mjs
          git diff --check
      - name: Commit once and push
        run: |
          git config user.name 'Elara Home Pass'
          git config user.email '139713890+Mohadesehjohari@users.noreply.github.com'
          git add tests/artwork-home-browser-acceptance.mjs .github/workflows/elara-test-fixture-fix-once.yml
          git commit -m 'test(home): seed and hydrate isolated fixture once so refresh persistence is meaningful'
          git push origin HEAD:main
