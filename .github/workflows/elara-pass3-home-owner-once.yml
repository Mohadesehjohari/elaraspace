name: Elara pass3 Home DOM ownership patch once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/elara-pass3-home-owner-once.yml']
permissions: {contents: write}
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Preserve geometry but hand Home content ownership to reference shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('visual-fidelity-pass3.js');s=p.read_text()
          for old,new in [
            (' if(tasksHost){tasksHost.innerHTML=', ' if(tasksHost&&!window.ElaraReferenceHome){tasksHost.innerHTML='),
            (' if(habits){\n   const wellness=', ' if(habits&&!window.ElaraReferenceHome){\n   const wellness='),
            (' if(missions){missions.innerHTML=', ' if(missions&&!window.ElaraReferenceHome){missions.innerHTML='),
            (' if(goals){goals.innerHTML=', ' if(goals&&!window.ElaraReferenceHome){goals.innerHTML=')
          ]:
            if s.count(old)!=1:raise SystemExit(f'ABORT incorrect markup owner anchor: {old}')
            s=s.replace(old,new,1)
          p.write_text(s)
          Path('.github/workflows/elara-pass3-home-owner-once.yml').unlink()
          PY
          node --check visual-fidelity-pass3.js
          git diff --check
      - name: Commit existing owner guard
        run: |
          git config user.name 'Elara Home Pass'
          git config user.email '139713890+Mohadesehjohari@users.noreply.github.com'
          git add visual-fidelity-pass3.js .github/workflows/elara-pass3-home-owner-once.yml
          git commit -m 'fix(home): stop pass3 legacy content writer after reference Home takes ownership'
          git push origin HEAD:main
