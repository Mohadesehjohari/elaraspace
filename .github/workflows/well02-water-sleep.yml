name: WELL-02 Private Green Water and Sleep
on:
  push:
    branches:
      - well02-green-water-sleep-20261011
      - main
  pull_request:
    paths:
      - boot.js
      - well02-wellness-pages.js
      - well02-wellness-pages.css
      - tests/well02-water-sleep-browser.mjs
      - .github/workflows/well02-water-sleep.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  well02-water-sleep:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, source compatibility and safe change guard
        run: |
          set -eu
          node --check boot.js
          node --check well02-wellness-pages.js
          node --check tests/well02-water-sleep-browser.mjs
          node tests/wellness-analysis.test.cjs
          test -s assets/ui/workout_banner_main.webp
          test -s assets/ui/health-fitness-card-background.webp
          if git diff --name-only origin/main...HEAD | grep -E '^(firestore.rules|storage.rules|firestore.indexes.json|cloud.js|elara-social.js|app.js|mobile-ia-2026-10-05.css|mobile-ia-2026-10-05.js|approved-navigation-extension.js|feature-hubs-2026.js|approved-wellness.js|well01-wellness-dashboard.js)$'; then
            echo "::error::Protected shared modules were touched"; exit 1
          fi
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve candidate and main baseline
        run: |
          python3 -m http.server 4173 >/tmp/well02-current.log 2>&1 &
          python3 -m http.server 4174 --directory baseline >/tmp/well02-baseline.log 2>&1 &
          sleep 3
          curl -fLsS http://127.0.0.1:4173/well02-wellness-pages.js >/dev/null
      - name: Full-width routes, actual water/sleep persistence and before/after
        env:
          ELARA_TEST_URL: http://127.0.0.1:4173
          ELARA_BASELINE_URL: http://127.0.0.1:4174
        run: timeout 720s node tests/well02-water-sleep-browser.mjs
      - name: Existing private wellness regression
        if: always()
        run: |
          timeout 240s node tests/wellness-notes-browser.mjs
          timeout 450s node tests/well01-wellness-dashboard-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: well02-water-sleep-before-after-${{ github.sha }}
          path: browser-artifacts/well02/*.png
          if-no-files-found: warn
          retention-days: 30
  production-verification:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm exact Wellness v2 production bytes after Pages deployment
        run: |
          set -euo pipefail
          base="https://mohadesehjohari.github.io/elaraspace"
          for i in $(seq 1 45); do
            curl -fLsS -H "Cache-Control: no-cache" "$base/boot.js?well02=$GITHUB_SHA" -o /tmp/well02-live-boot.js || true
            curl -fLsS -H "Cache-Control: no-cache" "$base/well02-wellness-pages.js?well02=$GITHUB_SHA" -o /tmp/well02-live.js || true
            curl -fLsS -H "Cache-Control: no-cache" "$base/well02-wellness-pages.css?well02=$GITHUB_SHA" -o /tmp/well02-live.css || true
            if cmp -s boot.js /tmp/well02-live-boot.js && cmp -s well02-wellness-pages.js /tmp/well02-live.js && cmp -s well02-wellness-pages.css /tmp/well02-live.css; then
              echo "PAGES_DEPLOYED_SHA=$GITHUB_SHA"
              exit 0
            fi
            echo "Waiting for Pages $i/45"
            sleep 20
          done
          echo "::error::Pages did not serve verified WELL-02 bytes"
          exit 1
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify live water/sleep, 10 widths, data privacy, CRUD and screenshots
        env:
          ELARA_TEST_URL: https://mohadesehjohari.github.io/elaraspace
        run: |
          timeout 720s node tests/well02-water-sleep-browser.mjs
          timeout 240s node tests/wellness-notes-browser.mjs
          echo "WELL02_LIVE_VERIFIED $GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: well02-live-screenshots-${{ github.sha }}
          path: browser-artifacts/well02/after-*.png
          if-no-files-found: warn
          retention-days: 30
