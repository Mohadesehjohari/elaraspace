name: PAGE R3 Sidebar and Composer Gate
on:
  push:
    branches:
      - feat/page-r3-sidebar-composer-20261012
  pull_request:
    paths:
      - page-view.js
      - page-fidelity-release3.css
      - tests/page-fidelity-r3-browser.mjs
      - .github/workflows/page-fidelity-r3.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  page-r3:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JS and assets
        run: |
          node --check page-view.js
          node --check tests/page-fidelity-r3-browser.mjs
          node --input-type=module --check < elara-page.js
          test -s assets/ui/icon-library-open-book.webp
          test -s assets/ui/38-my-page-hero-banner.webp
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve branch
        run: |
          python3 -m http.server 4173 >/tmp/elara-page-r3-http.log 2>&1 &
          sleep 2
      - name: Reference sidebar, compact posting, privacy and responsive 10 widths
        env:
          ELARA_TEST_URL: http://127.0.0.1:4173
        run: timeout 280s node tests/page-fidelity-r3-browser.mjs
      - name: Text-only media safety
        run: timeout 120s node tests/media-deferred-browser.mjs
      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: page-r3-390-1440
          path: browser-artifacts/page-r3-*.png
          if-no-files-found: warn
          retention-days: 14
