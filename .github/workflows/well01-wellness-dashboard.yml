name: WELL-01 Green Wellness Dashboard
on:
  push:
    branches:
      - well01-green-dashboard-20261011
      - main
  pull_request:
    paths:
      - boot.js
      - index.html
      - well01-wellness-dashboard.js
      - well01-wellness-dashboard.css
      - approved-wellness.js
      - tests/well01-wellness-dashboard-browser.mjs
      - .github/workflows/well01-wellness-dashboard.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wellness-dashboard:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Safety guard and JavaScript syntax
        run: |
          set -eu
          node --check boot.js
          node --check approved-wellness.js
          node --check well01-wellness-dashboard.js
          node --check tests/well01-wellness-dashboard-browser.mjs
          node tests/wellness-analysis.test.cjs
          test -s assets/ui/workout_banner_main.webp
          test -s assets/ui/health-fitness-card-background.webp
          if git diff --name-only origin/main...HEAD | grep -E '^(firestore.rules|storage.rules|firestore.indexes.json|cloud.js|elara-social.js|app.js|mobile-ia-2026-10-05.css|mobile-ia-2026-10-05.js|approved-navigation-extension.js|feature-hubs-2026.js)$'; then
            echo "::error::Protected shared modules were touched"; exit 1
          fi
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve PR and baseline independently
        run: |
          python3 -m http.server 4173 >/tmp/well01-current.log 2>&1 &
          python3 -m http.server 4174 --directory baseline >/tmp/well01-base.log 2>&1 &
          sleep 3
          curl -fLsS http://127.0.0.1:4173/well01-wellness-dashboard.js >/dev/null
      - name: Visual and functional cross-viewport acceptance
        env:
          ELARA_TEST_URL: http://127.0.0.1:4173
          ELARA_BASELINE_URL: http://127.0.0.1:4174
        run: timeout 600s node tests/well01-wellness-dashboard-browser.mjs
      - name: Existing private wellness notes
        if: always()
        run: timeout 240s node tests/wellness-notes-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: well01-before-after-${{ github.sha }}
          path: browser-artifacts/well01/*.png
          if-no-files-found: warn
          retention-days: 30

  production-verification:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for exact deployed GitHub Pages bytes
        run: |
          set -euo pipefail
          base="https://mohadesehjohari.github.io/elaraspace"
          for i in $(seq 1 45); do
            curl -fLsS -H "Cache-Control: no-cache" "$base/index.html?well01=$GITHUB_SHA" -o /tmp/well01-live-index.html || true
            curl -fLsS -H "Cache-Control: no-cache" "$base/approved-wellness.js?well01=$GITHUB_SHA" -o /tmp/well01-live-editor.js || true
            curl -fLsS -H "Cache-Control: no-cache" "$base/boot.js?well01=$GITHUB_SHA" -o /tmp/well01-live-boot.js || true
            curl -fLsS -H "Cache-Control: no-cache" "$base/well01-wellness-dashboard.js?well01=$GITHUB_SHA" -o /tmp/well01-live-dashboard.js || true
            curl -fLsS -H "Cache-Control: no-cache" "$base/well01-wellness-dashboard.css?well01=$GITHUB_SHA" -o /tmp/well01-live-dashboard.css || true
            if cmp -s index.html /tmp/well01-live-index.html && cmp -s approved-wellness.js /tmp/well01-live-editor.js && cmp -s boot.js /tmp/well01-live-boot.js && cmp -s well01-wellness-dashboard.js /tmp/well01-live-dashboard.js && cmp -s well01-wellness-dashboard.css /tmp/well01-live-dashboard.css; then
              echo "GitHub Pages contains exact main release files: $GITHUB_SHA"
              exit 0
            fi
            echo "Waiting for GitHub Pages deployment $i/45"
            sleep 20
          done
          echo "::error::GitHub Pages never served the expected main bytes"
          exit 1
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify real production routes, viewport screenshots, privacy, and persistence
        env:
          ELARA_TEST_URL: https://mohadesehjohari.github.io/elaraspace
        run: |
          timeout 600s node tests/well01-wellness-dashboard-browser.mjs
          timeout 240s node tests/wellness-notes-browser.mjs
          echo "LIVE_VERIFIED $GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: well01-production-screenshots-${{ github.sha }}
          path: browser-artifacts/well01/after-*.png
          if-no-files-found: warn
          retention-days: 30
