name: Home Bootstrap Diagnosis
on:
  pull_request:
    paths:
      - boot.js
      - index.html
      - elara-design.js
      - artwork-home-install-2026.js
      - focus-setup-reference-03.js
      - focus-two-mode.js
      - tests/focus02-no-freeze-browser.mjs
      - tests/focus-observer-freeze-browser.mjs
      - reference-home-shell-2026.js
      - tests/home-startup-diagnostic-browser.mjs
      - .github/workflows/home-startup-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install headless browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve repository
        run: |
          python3 -m http.server 4173 >/tmp/elara-http.log 2>&1 &
          sleep 1
      - name: Prevent recursive Focus-02 mount on Home
        env:
          ELARA_TEST_URL: http://127.0.0.1:4173
        run: timeout 75s node tests/focus02-no-freeze-browser.mjs
      - name: Diagnose real first-paint sequence
        env:
          ELARA_TEST_URL: http://127.0.0.1:4173
        run: timeout 90s node tests/home-startup-diagnostic-browser.mjs
      - name: Assert global UI remains responsive after Focus mutations
        env:
          ELARA_TEST_URL: http://127.0.0.1:4173
        run: timeout 80s node tests/focus-observer-freeze-browser.mjs
