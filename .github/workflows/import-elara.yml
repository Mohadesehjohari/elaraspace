name: Import Elara from private source (one time)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elara-one-time-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Require read-only access to the private source
        env:
          SOURCE_TOKEN: ${{ secrets.ELARA }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo '::error::Set the ELARA Actions repository secret to a token with Contents: Read access to ArenParsi/elaraspace.'
            exit 1
          fi
      - name: Check out the NEW public destination
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out the approved private source snapshot
        uses: actions/checkout@v4
        with:
          repository: ArenParsi/elaraspace
          ref: 0db0dc691b8d7d24c1012e262eb337a732c6b16c
          token: ${{ secrets.ELARA }}
          path: _elara_source
          persist-credentials: false
      - name: Copy allowlisted site files and run basic checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shutil, sys
          source = Path('_elara_source')
          root_ext = {'.html', '.css', '.js', '.md', '.rules'}
          site_ext = {'.html', '.css', '.js', '.png', '.jpg', '.jpeg', '.webp', '.gif', '.svg', '.ico', '.woff', '.woff2', '.ttf', '.otf'}
          test_ext = {'.mjs', '.md', '.json', '.txt', '.js'}
          picked = [p for p in source.iterdir() if p.is_file() and p.suffix.lower() in root_ext and not p.name.startswith('.')]
          for folder, allowed in (('assets', site_ext), ('admin', site_ext), ('tests', test_ext), ('docs', {'.md', '.txt'})):
              base = source / folder
              if base.is_dir():
                  picked.extend(p for p in base.rglob('*') if p.is_file() and p.suffix.lower() in allowed and not any(part.startswith('.') for part in p.relative_to(source).parts))
          if not (source / 'index.html').is_file():
              sys.exit('Missing index.html in private source; destination unchanged.')
          signatures = [
              re.compile(rb'-----BEGIN (?:RSA |OPENSSH |EC )?PRIVATE KEY-----'),
              re.compile(rb'ghp_[A-Za-z0-9]{25,}'),
              re.compile(rb'github_pat_[A-Za-z0-9_]{25,}'),
              re.compile(rb'sk-[A-Za-z0-9]{20,}'),
              re.compile(rb'AKIA[0-9A-Z]{16}'),
          ]
          for file in picked:
              if file.is_symlink():
                  sys.exit(f'Refusing to copy symlink: {file}')
              if file.suffix.lower() in {'.js', '.html', '.css', '.json', '.md', '.txt'} and any(p.search(file.read_bytes()) for p in signatures):
                  sys.exit(f'Possible private credential in {file}; manual review required.')
          for file in picked:
              target = Path('.') / file.relative_to(source)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(file, target)
          print(f'Copied {len(picked)} selected files. Existing destination-only avatars and frames are preserved.')
          PY
          test -s index.html
          test -s styles.css
          test -s app.js
          for file in ./*.js; do
            case "$file" in ./cloud.js|./elara-social.js) node --input-type=module --check < "$file" ;; *) node --check "$file" ;; esac
          done
          node tests/static-check.mjs
          rm -rf -- _elara_source
      - name: Commit import to the NEW repository only
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'The destination already contains this source snapshot.'
          else
            git commit -m 'feat: import approved Elara site from private source snapshot'
            trap 'git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"' EXIT
            git remote set-url origin "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin HEAD:main
          fi
