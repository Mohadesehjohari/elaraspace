name: LIB-04 Owner Wooden WebP Background
on:
  pull_request:
    paths:
      - assets/ui/Cinematic Gothic Library Alcove.webp
      - library-vertical-reference-03.css
      - index.html
      - tests/lib04-shelf-background-browser.mjs
      - .github/workflows/lib04-shelf-background.yml
  push:
    branches: [main]
    paths:
      - assets/ui/Cinematic Gothic Library Alcove.webp
      - library-vertical-reference-03.css
      - index.html
      - tests/lib04-shelf-background-browser.mjs
      - .github/workflows/lib04-shelf-background.yml
permissions:
  contents: read
jobs:
  candidate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Asset and syntax
        run: |
          test -s "assets/ui/Cinematic Gothic Library Alcove.webp"
          file "assets/ui/Cinematic Gothic Library Alcove.webp" | grep -q 'Web/P'
          node --check tests/lib04-shelf-background-browser.mjs
      - name: Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
      - name: Validate new scene and canonical book regression
        run: |
          python3 -m http.server 4173 >/tmp/lib04-http.log 2>&1 &
          sleep 3
          timeout 420s node tests/lib04-shelf-background-browser.mjs
          timeout 420s node tests/lib02-wooden-shelves-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lib04-wood-candidate
          path: browser-artifacts/lib04/*.png
          retention-days: 20
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for public Pages WebP, stylesheet and index
        run: |
          set -euo pipefail
          good=false
          for attempt in $(seq 1 80); do
            good=true
            for path in index.html library-vertical-reference-03.css "assets/ui/Cinematic Gothic Library Alcove.webp"; do
              tmp="/tmp/lib04-$(basename "$path")"
              if ! curl -fLsS --max-time 15 "https://mohadesehjohari.github.io/elaraspace/${path// /%20}?sha=$GITHUB_SHA&n=$attempt" -o "$tmp" || ! cmp -s "$path" "$tmp"; then good=false; break; fi
            done
            if [ "$good" = true ]; then echo "LIB04_WEBP_EXACT_LIVE_BYTES_PASS sha=$GITHUB_SHA"; break; fi
            sleep 8
          done
          if [ "$good" != true ]; then echo "::error::Published WebP/CSS/HTML do not match release"; exit 1;fi
      - name: Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install chromium
      - name: Verify seven live layouts
        run: ELARA_TEST_URL=https://mohadesehjohari.github.io/elaraspace timeout 420s node tests/lib04-shelf-background-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lib04-wood-production
          path: browser-artifacts/lib04/*.png
          retention-days: 30
