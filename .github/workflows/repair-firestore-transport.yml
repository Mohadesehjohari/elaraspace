name: Repair Firestore network transport
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-firestore-transport.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted Firestore transport and error-message fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('cloud.js')
          code = p.read_text(encoding='utf-8')
          replacements = [
              ("import {getFirestore,doc,getDoc,", "import {initializeFirestore,doc,getDoc,"),
              ("const auth=getAuth(app), db=getFirestore(app), $=id=>document.getElementById(id);", "// Force the long-polling transport to accommodate buffering proxies that can break Firestore WebChannel.\nconst auth=getAuth(app), db=initializeFirestore(app,{experimentalForceLongPolling:true}), $=id=>document.getElementById(id);"),
              ("'unavailable':'اتصال به دیتابیس برقرار نیست. اینترنت را بررسی کن.'", "'unavailable':'اتصال به Cloud Firestore برقرار نشد. اگر با تلاش دوباره رفع نشد، دسترسی مرورگر به firestore.googleapis.com و تنظیمات VPN، Proxy و افزونه‌های مسدودکننده را بررسی کن.'"),
          ]
          for old, new in replacements:
              if code.count(old) != 1:
                  raise SystemExit(f'Expected exactly one source match for {old[:45]!r}; change not applied.')
              code = code.replace(old, new, 1)
          p.write_text(code, encoding='utf-8')
          PY
          node --input-type=module --check < cloud.js
          node tests/static-check.mjs
      - name: Commit repair only to the public site repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud.js
          git commit -m 'fix: use long-polling for Firestore on proxy networks'
          git push origin HEAD:main
