name: UI13 Language Owner Art and Routes
on:
  push:
    branches:
      - ui13-language-owner-art-routes-20261010
  pull_request:
    paths:
      - boot.js
      - index.html
      - ui12-language-dashboard.*
      - ui13-language*
      - global-page-banner-20261009.js
      - language-custom-classes.js
      - social-clubs-ui.js
      - feature-hubs-shell.js
      - tests/ui13-language-owner-browser.mjs
      - tests/l2-language-leitner-browser.mjs
      - tests/l3-leitner-review-browser.mjs
      - tests/ui12-language-reference-browser.mjs
      - tests/p0-language-popup-browser.mjs
      - .github/workflows/ui13-language.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static safety and protected navigation contracts
        run: |
          set -eu
          for file in boot.js ui12-language-dashboard.js ui13-language-routes.js language-custom-classes.js social-clubs-ui.js feature-hubs-shell.js; do node --check "$file"; done
          for file in language_banner_main.webp librairy_banner_main.webp weblog_banner_main.webp workout_banner_main.webp daily-banner-bg_main.webp lightner.webp lightner_words_backgroud_pc.webp lightner_words_backgroud_mobile.webp; do test -s "assets/ui/$file"; done
          if git diff --name-only origin/main...HEAD | grep -E '^(firestore.rules|storage.rules|firestore.indexes.json|cloud.js|elara-social.js|mobile-ia-2026-10-05.css|mobile-ia-2026-10-05.js|approved-navigation-extension.js|reference-home-shell-2026.css)$'; then
            echo "::error::Protected backend/Home/global navigation modified"; exit 1
          fi
      - name: Install browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start candidate and original main
        run: |
          python3 -m http.server 4173 >/tmp/ui13-candidate.log 2>&1 &
          python3 -m http.server 4174 --directory baseline >/tmp/ui13-baseline.log 2>&1 &
          sleep 3
          curl -fLsS http://127.0.0.1:4173/ui13-language-routes.js >/dev/null
      - name: Nine-width owner art and route screenshots, classmate dialog
        run: timeout 420s node tests/ui13-language-owner-browser.mjs
      - name: L2 nine-width canonical Leitner dashboard
        run: timeout 240s node tests/l2-language-leitner-browser.mjs
      - name: L3 ten-width real Leitner word-review scene
        run: timeout 240s node tests/l3-leitner-review-browser.mjs
      - name: UI12 canonical state and full route matrix
        run: timeout 420s node tests/ui12-language-reference-browser.mjs
      - name: Full P0 Language, Tasks, Profile, and Leitner
        run: timeout 360s node tests/p0-language-popup-browser.mjs
      - name: Existing social, home, task and product browser
        if: always()
        run: timeout 330s node tests/product-hubs-store-browser.mjs
      - name: Diagnose identical failing suites against unmodified main (non-gating baseline)
        if: always()
        run: |
          set +e
          ELARA_TEST_URL=http://127.0.0.1:4174 timeout 360s node tests/p0-language-popup-browser.mjs > browser-artifacts/ui13/main-baseline-p0.log 2>&1
          p0_status=$?
          ELARA_TEST_URL=http://127.0.0.1:4174 timeout 330s node tests/product-hubs-store-browser.mjs > browser-artifacts/ui13/main-baseline-product.log 2>&1
          hubs_status=$?
          echo "::notice::Baseline main: P0=$p0_status ProductHubs=$hubs_status (not a candidate pass override)"
          grep -E 'wardrobe:start|locator.evaluateAll|getComputedStyle|Wellness tiles drifted|AssertionError|TimeoutError' browser-artifacts/ui13/main-baseline-*.log | tail -20 || true
          exit 0
      - name: Other safety contracts
        if: always()
        run: |
          node tests/p0-home-contract.test.mjs
          node tests/username-integrity-audit.test.mjs
          node tests/collab-invite-regression.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui13-owner-comparison-${{ github.sha }}
          path: |
            browser-artifacts/ui13/*.png
            browser-artifacts/language-l2/*.png
            browser-artifacts/language-l3/*.png
            browser-artifacts/ui13/*.log
            browser-artifacts/ui12/*.png
          if-no-files-found: warn
          retention-days: 30
