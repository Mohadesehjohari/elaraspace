name: Stage B Collab Link Security
on:
  push:
    branches:
      - security/expiring-collab-join-links-20261009
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules-and-link-security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Node syntax
        run: |
          node --check elara-collab.js
          node --check boot.js
          node --check tests/firestore-rules-emulator.mjs
          node --check tests/collab-link-security-regression.test.mjs
      - name: Crypto and existing invite regressions
        run: |
          node tests/collab-link-security-regression.test.mjs
          node tests/collab-invite-regression.test.mjs
          node tests/p0-home-contract.test.mjs
          node tests/username-integrity-audit.test.mjs
      - name: Install emulator rules-test dependencies
        run: npm install --prefix tests --no-package-lock
      - name: Firestore and Storage emulator authorization matrix
        run: npx --yes firebase-tools@latest emulators:exec --only firestore,storage --project demo-elara-rules --config firebase.json "node tests/firestore-rules-emulator.mjs"
