name: Request delivery regression
on:
  push:
    branches: [main]
    paths:
      - 'account-link.js'
      - 'elara-social.js'
      - 'elara-collab.js'
      - 'social-view.js'
      - 'boot.js'
      - 'firestore.rules'
      - 'tests/account-link-visibility.test.cjs'
      - 'tests/request-delivery-regression.cjs'
      - 'tests/social-hardening-regression.cjs'
      - 'notifications.js'
      - 'social-groups-ui.js'
      - 'social-clubs-ui.js'
      - 'social-challenges-ui.js'
      - '.github/workflows/request-delivery-regression.yml'
  pull_request:
    paths:
      - 'account-link.js'
      - 'elara-social.js'
      - 'elara-collab.js'
      - 'social-view.js'
      - 'boot.js'
      - 'firestore.rules'
      - 'tests/account-link-visibility.test.cjs'
      - 'tests/request-delivery-regression.cjs'
      - 'tests/social-hardening-regression.cjs'
      - 'notifications.js'
      - 'social-groups-ui.js'
      - 'social-clubs-ui.js'
      - 'social-challenges-ui.js'
      - '.github/workflows/request-delivery-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  requests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --input-type=module --check < account-link.js
          node --input-type=module --check < elara-social.js
          node --input-type=module --check < elara-collab.js
          node --check social-view.js
          node --check boot.js
          node --check tests/account-link-visibility.test.cjs
          node --check tests/request-delivery-regression.cjs
          node --check tests/social-hardening-regression.cjs
          node --check notifications.js
          node --check social-groups-ui.js
          node --check social-clubs-ui.js
          node --check social-challenges-ui.js
      - name: Two-account delivery and privacy regressions
        run: |
          node tests/account-link-visibility.test.cjs
          node tests/request-delivery-regression.cjs
          node tests/social-hardening-regression.cjs

  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase Rules test libraries
        run: npm install --prefix tests --no-package-lock
      - name: Multi-user Firestore security and social invitations
        run: >
          npx --yes firebase-tools@latest emulators:exec
          --only firestore
          --project demo-elara-rules
          --config firebase.json
          "node tests/firestore-rules-emulator.mjs"
