name: Request delivery regression
on:
  push:
    branches: [main]
    paths:
      - 'account-link.js'
      - 'elara-social.js'
      - 'elara-collab.js'
      - 'social-view.js'
      - 'boot.js'
      - 'firestore.rules'
      - 'tests/account-link-visibility.test.cjs'
      - 'tests/request-delivery-regression.cjs'
      - '.github/workflows/request-delivery-regression.yml'
  pull_request:
    paths:
      - 'account-link.js'
      - 'elara-social.js'
      - 'elara-collab.js'
      - 'social-view.js'
      - 'boot.js'
      - 'firestore.rules'
      - 'tests/account-link-visibility.test.cjs'
      - 'tests/request-delivery-regression.cjs'
      - '.github/workflows/request-delivery-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  requests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --input-type=module --check < account-link.js
          node --input-type=module --check < elara-social.js
          node --input-type=module --check < elara-collab.js
          node --check social-view.js
          node --check boot.js
          node --check tests/account-link-visibility.test.cjs
          node --check tests/request-delivery-regression.cjs
      - name: Two-account delivery and privacy regressions
        run: |
          node tests/account-link-visibility.test.cjs
          node tests/request-delivery-regression.cjs
