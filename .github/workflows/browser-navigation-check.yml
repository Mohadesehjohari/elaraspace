name: Browser navigation acceptance
on:
  push:
    branches: [main]
    paths:
      - 'approved-navigation-extension.js'
      - 'approved-navigation-extension.css'
      - 'visual-fidelity-pass2.js'
      - 'visual-fidelity-pass3.js'
      - 'approved-visual.js'
      - 'drawer.js'
      - 'boot.js'
      - 'elara-design.js'
      - 'reference-home-shell-2026.*'
      - 'reference-shell-compat-2026.js'
      - 'artwork-home-install-2026.*'
      - 'home-functional-pass-2026.*'
      - 'assets/ui/*.webp'
      - 'deploy/production-manifest.json'
      - 'tests/artwork-home-browser-acceptance.mjs'
      - 'tests/reference-computed-css.mjs'
      - '.github/workflows/browser-navigation-check.yml'
permissions:
  contents: read
jobs:
  browser-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Home owner, bridge and acceptance script syntax
        run: |
          node --check elara-design.js
          node --check visual-fidelity-pass3.js
          node --check reference-home-shell-2026.js
          node --check home-functional-pass-2026.js
          node --check artwork-home-install-2026.js
          node --check boot.js
          node --check tests/artwork-home-browser-acceptance.mjs
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/elara-http.log 2>&1 &
          sleep 2
      - name: Diagnose computed CSS ownership
        run: node tests/reference-computed-css.mjs
      - name: Run approved Home artwork, navigation, geometry and screenshot acceptance
        run: node tests/artwork-home-browser-acceptance.mjs
      - name: Upload actual browser viewport and full-page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-home-artwork-browser-screenshots
          path: browser-artifacts/
          if-no-files-found: warn
          retention-days: 14
