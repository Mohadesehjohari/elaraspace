name: AI Gateway Contract
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/elara-ai-worker.js'
      - 'ai-gateway-config.js'
      - 'admin/admin.js'
      - 'admin/index.html'
      - 'freedom-ai.js'
      - 'private-state.js'
      - 'cloud.js'
      - 'index.html'
      - 'tests/private-state-ram.test.mjs'
      - 'tests/cloud-migration.test.mjs'
      - 'tools/admin-backup/**'
      - 'tests/admin-backup-offline.test.mjs'
      - 'elara-ai-task-actions.js'
      - 'elara-ai-actions.js'
      - 'elara-ai-plans.js'
      - 'tests/ai-conversation-plan.test.mjs'
      - 'tests/ai-conversation-browser.test.mjs'
      - 'freedom-chat-page.js'
      - 'freedom-chat-page.css'
      - 'boot.js'
      - 'tests/freedom-fox-chat-contract.mjs'
      - 'tests/dual-persona-chat-contract.mjs'
      - 'tests/ai-gateway-contract.test.mjs'
      - 'tests/ai-cloud-memory.test.mjs'
      - 'tests/ai-rolling-memory.test.mjs'
      - 'tests/ai-task-plan.test.mjs'
      - 'tests/ai-site-actions.test.mjs'
      - 'tests/ai-site-actions-browser.test.mjs'
      - '.github/workflows/ai-gateway-contract.yml'
  pull_request:
    paths:
      - 'cloudflare/elara-ai-worker.js'
      - 'ai-gateway-config.js'
      - 'admin/admin.js'
      - 'admin/index.html'
      - 'freedom-ai.js'
      - 'private-state.js'
      - 'cloud.js'
      - 'index.html'
      - 'tests/private-state-ram.test.mjs'
      - 'tests/cloud-migration.test.mjs'
      - 'tools/admin-backup/**'
      - 'tests/admin-backup-offline.test.mjs'
      - 'elara-ai-task-actions.js'
      - 'elara-ai-actions.js'
      - 'elara-ai-plans.js'
      - 'tests/ai-conversation-plan.test.mjs'
      - 'tests/ai-conversation-browser.test.mjs'
      - 'freedom-chat-page.js'
      - 'freedom-chat-page.css'
      - 'boot.js'
      - 'tests/freedom-fox-chat-contract.mjs'
      - 'tests/dual-persona-chat-contract.mjs'
      - 'tests/ai-gateway-contract.test.mjs'
      - 'tests/ai-cloud-memory.test.mjs'
      - 'tests/ai-rolling-memory.test.mjs'
      - 'tests/ai-task-plan.test.mjs'
      - 'tests/ai-site-actions.test.mjs'
      - 'tests/ai-site-actions-browser.test.mjs'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --input-type=module --check < cloudflare/elara-ai-worker.js
          node --input-type=module --check < admin/admin.js
          node --check freedom-ai.js
          node --check private-state.js
          node --input-type=module --check < cloud.js
          node --check drawer.js
          node --check tools/admin-backup/backup.mjs
          node --check elara-ai-task-actions.js
          node --check elara-ai-actions.js
          node --check elara-ai-plans.js
          node --check freedom-chat-page.js
      - name: Check AI gateway contracts
        run: |
          node tests/ai-gateway-contract.test.mjs
          node tests/freedom-fox-chat-contract.mjs
          node tests/dual-persona-chat-contract.mjs
      - name: Test private cross-device memory
        run: |
          node tests/ai-cloud-memory.test.mjs
          node tests/ai-rolling-memory.test.mjs
          node tests/ai-task-plan.test.mjs
          node tests/ai-site-actions.test.mjs
          node tests/ai-site-actions-browser.test.mjs
          node tests/ai-conversation-plan.test.mjs
          node tests/ai-conversation-browser.test.mjs
          node tests/private-state-ram.test.mjs
          node tests/cloud-migration.test.mjs
          node tests/admin-backup-offline.test.mjs
