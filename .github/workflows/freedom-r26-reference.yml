name: Freedom R26 Reference Chromium Gate
on:
  push:
    branches:
      - freedom-reference-redesign-20261012
  pull_request:
    paths:
      - 'freedom-dashboard-r2026.js'
      - 'freedom-dashboard-r2026.css'
      - 'freedom-enhancements.js'
      - 'freedom-diary-music.js'
      - 'boot.js'
      - 'index.html'
      - 'deploy/production-manifest.json'
      - 'tests/freedom-r26-browser.mjs'
      - '.github/workflows/freedom-r26-reference.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  freedom-r26:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax, assets, and shipping manifest
        run: |
          node --check boot.js
          node --check freedom-dashboard-r2026.js
          node --check freedom-enhancements.js
          node --check freedom-diary-music.js
          node --check tests/freedom-r26-browser.mjs
          test -s 'assets/ui/freedom_banner.webp'
          test -s 'assets/ui/Celestial Crystal Spellbook Icon.webp'
          node -e "let m=require('./deploy/production-manifest.json');for(let f of ['freedom-dashboard-r2026.js','freedom-dashboard-r2026.css']){if(!m.required.includes(f)||!m.files.includes(f))process.exit(1)}"
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start candidate and baseline local servers
        run: |
          git worktree add --detach /tmp/elara-freedom-baseline 07e2f7cc587d04f8ee3587f80a262c8656e83ec3
          python3 -m http.server 4173 >/tmp/freedom-after-http.log 2>&1 &
          python3 -m http.server 4174 --directory /tmp/elara-freedom-baseline >/tmp/freedom-before-http.log 2>&1 &
          sleep 3
      - name: Test 10 widths, diary data, history and screenshots
        env:
          ELARA_TEST_URL: http://127.0.0.1:4173
          ELARA_BEFORE_URL: http://127.0.0.1:4174
        run: timeout 360s node tests/freedom-r26-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freedom-r26-before-after
          path: browser-artifacts/freedom-*.png
          if-no-files-found: warn
          retention-days: 14
