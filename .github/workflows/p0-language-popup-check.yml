name: P0 language and mobile popup regression
on:
  push:
    branches: [main]
    paths:
      - 'approved-visual.js'
      - 'deploy/server/ElaraAiRuntime.php'
      - 'freedom-refinement-v2.css'
      - 'freedom-ai.js'
      - 'admin/ai.php'
      - 'ai.php'
      - 'linked-tasks.js'
      - 'library-enhancements.js'
      - 'reading.js'
      - 'app.js'
      - 'freedom-page.js'
      - 'freedom-page.css'
      - 'freedom-enhancements.js'
      - 'october-fixes-2026-10-01.css'
      - 'tests/artwork-home-browser-acceptance.mjs'
      - 'tests/astra-reference-v2.test.cjs'
      - 'tests/pass4-account-wardrobe-theme.test.mjs'
      - 'approved-wellness.js'
      - 'tests/wellness-analysis.test.cjs'
      - 'reference-home-shell-2026.css'
      - 'reference-home-shell-2026.js'
      - 'visual-fidelity-pass4.css'
      - 'approved-profile-system.js'
      - 'approved-navigation-extension.js'
      - 'approved-navigation-extension.css'
      - 'notifications.js'
      - 'phase2.js'
      - 'elara-levels.js'
      - 'collection-level.js'
      - 'tests/task-bulk-reorder-browser.mjs'
      - 'tests/focus-ambience-browser.mjs'
      - 'tests/entity-reorder-browser.mjs'
      - 'tests/task-collections-browser.mjs'
      - 'task-bulk-reorder.js'
      - 'entity-reorder.js'
      - 'task-collections.js'
      - 'focus-ambience.js'
      - 'social-view.js'
      - 'tests/social-engagement-browser.mjs'
      - 'social-engagement-view.js'
      - 'social-engagement.js'
      - 'social-messaging-ui.js'
      - 'tests/friends-groups-ui-browser.mjs'
      - 'tests/clubs-stage11-browser.mjs'
      - 'tests/challenges-stage12-browser.mjs'
      - 'social-groups-ui.js'
      - 'social-clubs-ui.js'
      - 'social-challenges-ui.js'
      - 'elara-design.js'
      - 'firestore.rules'
      - 'page-view.js'
      - 'elara-page.js'
      - 'elara-social.js'
      - 'i18n.js'
      - 'drawer.js'
      - 'dialog.js'
      - 'reference-exact-pass-2026.css'
      - 'deploy/production-manifest.json'
      - 'reference-restore.css'
      - 'visual-fidelity-pass5.css'
      - 'approved-visual.css'
      - 'boot.js'
      - 'cloud.js'
      - 'tests/production-boot-browser.mjs'
      - 'index.html'
      - 'tests/p0-language-popup-browser.mjs'
      - 'tests/library-stage4-browser.mjs'
      - 'tests/friends-dm-ui-browser.mjs'
      - 'tests/page-stage6-browser.mjs'
      - 'tests/profile-assets-contract.test.mjs'
      - 'tests/restore-browser.mjs'
      - '.github/workflows/p0-language-popup-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  p0-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check changed JavaScript and regression syntax
        run: |
          node --check approved-visual.js
          node --check approved-navigation-extension.js
          node --check notifications.js
          node --check drawer.js
          node --check dialog.js
          node --check phase2.js
          node --check entity-reorder.js
          node --check task-collections.js
          node --check elara-levels.js
          node --check collection-level.js
          node --check task-bulk-reorder.js
          node --check focus-ambience.js
          node --check library-enhancements.js
          node --check social-messaging-ui.js
          node --check social-groups-ui.js
          node --check social-clubs-ui.js
          node --check social-challenges-ui.js
          node --check social-engagement.js
          node --check social-engagement-view.js
          node --check page-view.js
          node --check elara-page.js
          node --check reading.js
          node --check app.js
          node --check approved-profile-system.js
          node --check approved-wellness.js
          node --check tests/wellness-analysis.test.cjs
          node tests/wellness-analysis.test.cjs
          node --check reference-home-shell-2026.js
          node --check tests/p0-language-popup-browser.mjs
          node --check tests/focus-ambience-browser.mjs
          node --check tests/entity-reorder-browser.mjs
          node --check tests/task-collections-browser.mjs
          node --check tests/library-stage4-browser.mjs
          node --check tests/friends-dm-ui-browser.mjs
          node --check tests/friends-groups-ui-browser.mjs
          node --check tests/clubs-stage11-browser.mjs
          node --check tests/challenges-stage12-browser.mjs
          node --check tests/page-stage6-browser.mjs
          node --check tests/social-engagement-browser.mjs
          node --check tests/task-bulk-reorder-browser.mjs
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 >/tmp/elara-p0-http.log 2>&1 &
          sleep 2
      - name: Verify language shelf, reading/delete and centered mobile profile
        run: timeout 180s node tests/p0-language-popup-browser.mjs
      - name: Verify Library Stage 4 interactions
        run: timeout 120s node tests/library-stage4-browser.mjs
      - name: Verify Friends DM UI interactions
        run: timeout 90s node tests/friends-dm-ui-browser.mjs
      - name: Verify Friends group chat interactions
        run: timeout 90s node tests/friends-groups-ui-browser.mjs
      - name: Verify Clubs Stage 11 interactions
        run: timeout 90s node tests/clubs-stage11-browser.mjs
      - name: Verify Challenges Stage 12 interactions
        run: timeout 90s node tests/challenges-stage12-browser.mjs
      - name: Verify Page Stage 6 interactions
        run: timeout 90s node tests/page-stage6-browser.mjs
      - name: Verify Social engagement Stage 7 interactions
        run: timeout 90s node tests/social-engagement-browser.mjs
      - name: Verify Task bulk selection and reorder Stage 9
        run: timeout 90s node tests/task-bulk-reorder-browser.mjs
      - name: Verify Pomodoro ambience Stage 13
        run: timeout 90s node tests/focus-ambience-browser.mjs
      - name: Verify Habit and Goal reorder Stage 13
        run: timeout 90s node tests/entity-reorder-browser.mjs
      - name: Verify independent Task collection pages Stage 14
        run: timeout 90s node tests/task-collections-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elara-p0-${{ github.sha }}
          path: browser-artifacts/
          if-no-files-found: error
          retention-days: 30

  pages-browser:
    needs: p0-browser
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for END build on GitHub Pages
        env:
          ELARA_PUBLIC_URL: https://mohadesehjohari.github.io/elaraspace/
        run: |
          ELARA_BUILD_MARKER="$(sed -n 's/.*deploy-refresh: \([^ ]*\).*/\1/p' index.html | head -n1)"
          test -n "$ELARA_BUILD_MARKER" || { echo "Missing deploy-refresh marker in index.html" >&2; exit 1; }
          echo "Waiting for Pages build marker: $ELARA_BUILD_MARKER"
          for attempt in $(seq 1 48); do
            if curl --fail --silent --show-error --location --max-time 15 "${ELARA_PUBLIC_URL}?sha=${GITHUB_SHA}-${attempt}" -o /tmp/elara-pages-index.html; then
              if grep -q "${ELARA_BUILD_MARKER}" /tmp/elara-pages-index.html; then
                echo "Pages serves ${ELARA_BUILD_MARKER} for ${GITHUB_SHA}"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "GitHub Pages did not expose ${ELARA_BUILD_MARKER} for ${GITHUB_SHA}" >&2
          head -n 8 /tmp/elara-pages-index.html 2>/dev/null || true
          exit 1
      - name: Verify deployed Pages with real Playwright
        env:
          ELARA_TEST_URL: https://mohadesehjohari.github.io/elaraspace
        run: timeout 180s node tests/p0-language-popup-browser.mjs
      - name: Verify deployed Library Stage 4 interactions
        env:
          ELARA_TEST_URL: https://mohadesehjohari.github.io/elaraspace
        run: timeout 120s node tests/library-stage4-browser.mjs
      - name: Verify deployed Friends DM UI interactions
        env:
          ELARA_TEST_URL: https://mohadesehjohari.github.io/elaraspace
        run: timeout 90s node tests/friends-dm-ui-browser.mjs
      - name: Verify deployed Friends group chat interactions
        env:
          ELARA_TEST_URL: https://mohadesehjohari.github.io/elaraspace
        run: timeout 90s node tests/friends-groups-ui-browser.mjs
      - name: Verify deployed Clubs Stage 11 interactions
        env:
          ELARA_TEST_URL: https://mohadesehjohari.github.io/elaraspace
        run: timeout 90s node tests/clubs-stage11-browser.mjs
      - name: Verify deployed Challenges Stage 12 interactions
        env:
          ELARA_TEST_URL: https://mohadesehjohari.github.io/elaraspace
        run: timeout 90s node tests/challenges-stage12-browser.mjs
      - name: Verify deployed Page Stage 6 interactions
        env:
          ELARA_TEST_URL: https://mohadesehjohari.github.io/elaraspace
        run: timeout 90s node tests/page-stage6-browser.mjs
      - name: Verify deployed Social engagement Stage 7 interactions
        env:
          ELARA_TEST_URL: https://mohadesehjohari.github.io/elaraspace
        run: timeout 90s node tests/social-engagement-browser.mjs
      - name: Verify deployed Task bulk selection and reorder Stage 9
        env:
          ELARA_TEST_URL: https://mohadesehjohari.github.io/elaraspace
        run: timeout 90s node tests/task-bulk-reorder-browser.mjs
      - name: Verify deployed Pomodoro ambience Stage 13
        env:
          ELARA_TEST_URL: https://mohadesehjohari.github.io/elaraspace
        run: timeout 90s node tests/focus-ambience-browser.mjs
      - name: Verify real Firebase/account boot without stubs
        env:
          ELARA_TEST_URL: https://mohadesehjohari.github.io/elaraspace
        run: timeout 60s node tests/production-boot-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elara-pages-p0-${{ github.sha }}
          path: browser-artifacts/
          if-no-files-found: error
          retention-days: 30
