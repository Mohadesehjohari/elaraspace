name: P0 profile username production hotfix

on:
  pull_request:
    paths:
      - '.github/workflows/p0-profile-username-hotfix.yml'
      - 'index.html'
      - 'boot.js'
      - 'cloud.js'
      - 'approved-profile-system.js'
      - 'elara-social.js'
      - 'firestore.rules'
      - 'tests/username-runtime-regression.test.mjs'
      - 'tests/username-integrity-audit.test.mjs'
      - 'tests/profile-social-readiness-browser.mjs'
      - 'tests/hotfix-mobile-smoke.mjs'
      - 'tests/firestore-rules-emulator.mjs'
      - 'tools/username-integrity-core.mjs'
      - 'tools/username-integrity-audit.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check boot.js
          node --check approved-profile-system.js
          node --input-type=module --check < cloud.js
          node --input-type=module --check < elara-social.js
          node --check tests/username-runtime-regression.test.mjs
          node --check tests/username-integrity-audit.test.mjs
          node --check tools/username-integrity-core.mjs
          node --check tools/username-integrity-audit.mjs
      - name: Username identity regressions
        run: |
          node tests/username-runtime-regression.test.mjs
          node tests/username-integrity-audit.test.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start hotfix site
        run: |
          python3 -m http.server 4173 >/tmp/elara-hotfix-http.log 2>&1 &
          sleep 2
      - name: Delayed and failed Social profile readiness
        run: timeout 120s node tests/profile-social-readiness-browser.mjs
      - name: Mobile Home no-overflow matrix
        run: timeout 120s node tests/hotfix-mobile-smoke.mjs

  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install emulator dependencies
        run: npm install --prefix tests --no-package-lock
      - name: Firestore identity emulator
        run: |
          npx --yes firebase-tools@latest emulators:exec --only firestore,storage --project demo-elara-rules --config firebase.json "node tests/firestore-rules-emulator.mjs"
