name: Store reference acceptance
on:
  pull_request:
    paths:
      - 'store-view.js'
      - 'store-reference-2026.css'
      - 'global-page-banner-20261009.*'
      - 'boot.js'
      - 'index.html'
      - 'tests/store-reference-browser.mjs'
      - '.github/workflows/store-reference-validation.yml'
  workflow_dispatch:
jobs:
  visual-store:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium tooling
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify syntax
        run: |
          node --check store-view.js
          node --check global-page-banner-20261009.js
          node --check boot.js
          node --check tests/store-reference-browser.mjs
      - name: Serve and test ten viewports
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/elara-store-server.log 2>&1 &
          sleep 2
          ELARA_TEST_URL=http://127.0.0.1:4173 node tests/store-reference-browser.mjs
      - name: Attach reference screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-reference-390-1440
          path: artifacts/store-reference/
          if-no-files-found: ignore
