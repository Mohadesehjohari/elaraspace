name: Tasks Completion Feedback QA
on:
  push:
    branches: [main]
    paths:
      - 'phase2.js'
      - 'task-completion-polish-20261014.css'
      - 'tests/task-completion-feedback-browser.mjs'
      - '.github/workflows/task-completion-feedback.yml'
  pull_request:
    paths:
      - 'phase2.js'
      - 'task-completion-polish-20261014.css'
      - 'tests/task-completion-feedback-browser.mjs'
      - '.github/workflows/task-completion-feedback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and compiled CSS existence
        run: |
          node --check phase2.js
          node --check tests/task-completion-feedback-browser.mjs
          test -s task-completion-polish-20261014.css
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Serve website
        run: |
          python3 -m http.server 4173 >/tmp/tasks-feedback-qa.log 2>&1 &
          sleep 2
      - name: Verify round counter, golden wait, compact archive and blue check
        run: |
          timeout 220s node tests/task-completion-feedback-browser.mjs
