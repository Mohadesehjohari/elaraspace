name: Validate Elara site
on:
  push:
    branches: [main]
    paths: ['*.html', '*.css', '*.js', '*.php', '.htaccess', '.cpanel.yml', 'assets/**', 'admin/**', 'deploy/**', 'tests/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Required site files
        run: test -s index.html && test -s styles.css && test -s app.js
      - name: Check JavaScript
        run: |
          for file in ./*.js; do
            case "$file" in ./cloud.js|./elara-social.js) node --input-type=module --check < "$file" ;; *) node --check "$file" ;; esac
          done
          node --check admin/admin.js
      - name: Check PHP and deployment shell
        run: |
          find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          bash -n deploy/cpanel-deploy.sh
      - name: Verify app and production deployment contracts
        run: |
          node tests/static-check.mjs
          node tests/p0-home-contract.test.mjs
          node tests/navigation-sidebar-contract.test.mjs
          node tests/deployment-contract.test.mjs
          php tests/deployment-runtime.test.php
