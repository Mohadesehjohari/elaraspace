name: Build public SEO pages (review artifact)

on:
  pull_request:
    paths:
      - "admin/**"
      - "firestore.rules"
      - "seo/**"
      - "tools/build_seo.py"
      - "tools/sync_public_seo.py"
      - "tools/assemble_pages_site.py"
      - "deploy/production-manifest.json"
      - "tests/test_seo_builder.py"
      - "tests/test_seo_sync.py"
      - "tests/test-seo-dashboard.mjs"
      - ".github/workflows/publish-public-seo-pages.yml"
      - ".github/workflows/build-public-seo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run SEO builder tests
        run: python -m unittest discover -s tests -p 'test_seo*.py' -v
      - name: Check JavaScript module syntax
        run: |
          node --input-type=module --check < admin/admin.js
          node --input-type=module --check < admin/seo-manager.js
      - name: Test SEO Studio export and CSV parser
        run: node tests/test-seo-dashboard.mjs
      - name: Generate static public pages
        run: python tools/build_seo.py --input seo/public-content.json --out seo-dist
      - name: Build full site artifact safely from production manifest
        run: python tools/assemble_pages_site.py --root . --seo seo-dist --out pages-dist
      - name: Upload review-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: elara-seo-static-pages
          path: pages-dist/
          if-no-files-found: error
