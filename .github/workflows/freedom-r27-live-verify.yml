name: Freedom R27 Live Site Verify
on:
  push:
    branches:
      - qa/freedom-r27-live-20261012
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wait for GitHub Pages exact R27 files
        run: |
          set -e
          base=https://mohadesehjohari.github.io/elaraspace
          ready=0
          for attempt in $(seq 1 72); do
            ok=1
            for file in boot.js freedom-dashboard-r2026.js freedom-enhancements.js freedom-r27-music.js freedom-r27-polish.css; do
              curl -fsSL --max-time 15 "$base/$file?liveR27=$attempt" -o "/tmp/production-$(basename $file)" || ok=0
              if [ "$ok" = 1 ] && ! cmp -s "$file" "/tmp/production-$(basename $file)"; then ok=0; fi
            done
            if [ "$ok" = 1 ]; then ready=1; echo "FREEDOM_R27_LIVE_EXACT_FILES=PASS"; break; fi
            sleep 8
          done
          test "$ready" = 1
          curl -fsSL "$base/?liveR27=final" -o /tmp/r27-index.html
          grep -q '20261012-freedom-r27-live-v1' /tmp/r27-index.html
          echo "FREEDOM_R27_LIVE_BOOT_INDEX=PASS"
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser QA on real published site
        env:
          ELARA_TEST_URL: https://mohadesehjohari.github.io/elaraspace
        run: timeout 360s node tests/freedom-r27-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freedom-r27-live-screenshots
          path: browser-artifacts/freedom-r27-*.png
          if-no-files-found: warn
