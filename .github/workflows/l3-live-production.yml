name: L3 Live Production Browser Check
on:
  pull_request:
    paths:
      - .github/workflows/l3-live-production.yml
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real GitHub Pages Chromium tests (isolated mock storage, no user mutations)
        env:
          ELARA_TEST_URL: https://mohadesehjohari.github.io/elaraspace
        run: timeout 240s node tests/l3-leitner-review-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l3-live-production-${{ github.sha }}
          path: browser-artifacts/language-l3/*.png
          if-no-files-found: warn
